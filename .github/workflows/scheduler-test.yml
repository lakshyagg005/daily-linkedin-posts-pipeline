name: Scheduler Diagnostic Test

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

jobs:
  scheduler-test:
    runs-on: ubuntu-latest
    steps:
      - name: Scheduler Test
        run: |
          echo "================================"
          echo "GITHUB SCHEDULER TEST WORKING"
          echo "Triggered at:"
          date
          echo "Event:"
          echo "${{ github.event_name }}"
          echo "================================"
