name: Personal Brand Daily Content Pipeline

on:
  schedule:
    # Daily at 09:10 IST using GitHub's native timezone support
    - cron: '10 9 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force overwrite existing daily output'
        required: false
        type: boolean
        default: false

concurrency:
  group: personal-brand-daily
  cancel-in-progress: false

jobs:
  build-and-generate:
    name: Generate Personal Brand Daily Content Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      LLM_FREE_ONLY: "true"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node & Puppeteer Dependencies
        run: |
          cd carousel-routine
          npm ci
          npx puppeteer browsers install chrome

      - name: Run Personal Brand Daily Pipeline
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Running pipeline with --force flag..."
            python3 run_personal_brand_daily.py --force
          else
            echo "Running scheduled daily pipeline..."
            python3 run_personal_brand_daily.py
          fi

      - name: Validate Output Quality & Artifact Integrity
        run: |
          python3 -c "
          import os, sys, json
          from pathlib import Path
          from datetime import date

          today_str = date.today().isoformat()
          print(f'Validating pipeline outputs for date: {today_str}')

          # 1. Daily manifest
          manifest_path = Path(f'content/{today_str}/daily_manifest.json')
          if not manifest_path.exists() or manifest_path.stat().st_size == 0:
              print('❌ Validation failed: Missing or empty daily_manifest.json')
              sys.exit(1)

          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = json.load(f)

          if manifest.get('status') != 'success':
              print(f'❌ Validation failed: Manifest status is {manifest.get(\"status\")}')
              sys.exit(1)

          # 2. LinkedIn post
          linkedin_file = Path(f'content/linkedin/{today_str}/linkedin_post.md')
          if not linkedin_file.exists() or linkedin_file.stat().st_size == 0:
              print('❌ Validation failed: Missing or empty linkedin_post.md')
              sys.exit(1)

          # 3. X posts
          x_md = Path(f'content/x/{today_str}/x_posts.md')
          x_json = Path(f'content/x/{today_str}/x_posts.json')
          if not x_md.exists() or x_md.stat().st_size == 0:
              print('❌ Validation failed: Missing or empty x_posts.md')
              sys.exit(1)
          if not x_json.exists() or x_json.stat().st_size == 0:
              print('❌ Validation failed: Missing or empty x_posts.json')
              sys.exit(1)

          with open(x_json, 'r', encoding='utf-8') as f:
              x_posts = json.load(f)
          if not isinstance(x_posts, list) or len(x_posts) != 3:
              print(f'❌ Validation failed: Expected 3 X posts, found {len(x_posts) if isinstance(x_posts, list) else 0}')
              sys.exit(1)

          # 4. Carousel HTML slides & Lakshya Goyal watermark
          temp_dir = Path('carousel-routine/temp/personal-brand')
          html_files = sorted(list(temp_dir.glob('slide-*.html')))
          if len(html_files) != 7:
              print(f'❌ Validation failed: Expected 7 HTML slides, found {len(html_files)}')
              sys.exit(1)

          for idx, html_p in enumerate(html_files, 1):
              content = html_p.read_text(encoding='utf-8')
              if 'Lakshya Goyal' not in content:
                  print(f'❌ Validation failed: Watermark \"Lakshya Goyal\" missing on slide {idx}')
                  sys.exit(1)

          # 5. PNG slides & PDF
          out_dir = Path(f'carousel-routine/output/{today_str}/personal-brand')
          png_files = sorted(list(out_dir.glob('slide-*.png')))
          if len(png_files) != 7:
              print(f'❌ Validation failed: Expected 7 PNG slides, found {len(png_files)}')
              sys.exit(1)

          for png_p in png_files:
              if png_p.stat().st_size < 5000:
                  print(f'❌ Validation failed: Suspiciously small PNG file {png_p.name} ({png_p.stat().st_size} bytes)')
                  sys.exit(1)

          pdf_files = sorted(list(out_dir.glob('carousel-*.pdf')))
          if len(pdf_files) != 1:
              print(f'❌ Validation failed: Expected 1 carousel PDF file, found {len(pdf_files)}')
              sys.exit(1)

          if pdf_files[0].stat().st_size < 10000:
              print(f'❌ Validation failed: Suspiciously small PDF file ({pdf_files[0].stat().st_size} bytes)')
              sys.exit(1)

          print('✅ ALL PIPELINE OUTPUT VALIDATIONS PASSED SUCCESSFULLY!')
          "

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload Daily Content Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-personal-brand-content-${{ steps.date.outputs.date }}
          retention-days: 7
          path: |
            content/linkedin/*/*.md
            content/x/*/*.md
            content/x/*/*.json
            content/*/*.json
            carousel-routine/output/*/*/*.png
            carousel-routine/output/*/*/*.pdf
